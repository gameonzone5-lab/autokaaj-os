<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.1.0/lib/xterm.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.1.0/lib/xterm.min.js"></script>
    <style>body { background: #000; margin: 0; padding: 10px; }</style>
</head>
<body>
    <div id="terminal" style="width:100%; height:90vh;"></div>
    <script>
        const term = new Terminal({cursorBlink: true, theme: {background: '#000', foreground: '#0f0'}});
        term.open(document.getElementById('terminal'));
        term.write('AutoKaaj OS Linux Shell Initialized...\r\n$ ');
        
        term.onData(async e => {
            if (e === '\r') {
                term.write('\r\n');
                return;
            }
            term.write(e);
        });
    </script>
</body>
</html>
