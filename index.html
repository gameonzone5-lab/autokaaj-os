<!DOCTYPE html>
<html>
<body style="background:#000; color:#0f0; font-family:monospace; padding:20px;">
    <h2>AutoKaaj Installer Hub</h2>
    <button onclick="install('claude')" style="padding:15px; background:#0f0; border:none; width:100%;">Install Claude Code</button>
    <button onclick="install('ollama')" style="padding:15px; background:#0f0; border:none; width:100%; margin-top:10px;">Install Ollama</button>
    <div id="logs" style="margin-top:20px; border:1px solid #333; padding:10px;">Logs: Waiting...</div>
    <script>
        async function install(tool) {
            document.getElementById('logs').innerText = "Installing " + tool + "... check terminal";
            await fetch('/api/install', {method: 'POST', body: JSON.stringify({tool: tool})});
        }
    </script>
</body>
</html>
<div id="api-vault" style="margin-top:20px; border:1px solid #0f0; padding:10px;">
    <h3>API Vault</h3>
    <input type="text" id="service" placeholder="Service Name (e.g. Claude)">
    <input type="password" id="key" placeholder="Enter API Key">
    <button onclick="saveApi()">Save Key</button>
</div>
<script>
async function saveApi() {
    let service = document.getElementById('service').value;
    let key = document.getElementById('key').value;
    await fetch('/api/save-key', {
        method: 'POST', 
        body: JSON.stringify({service: service, key: key})
    });
    alert("API Key Encrypted and Saved!");
}
</script>
