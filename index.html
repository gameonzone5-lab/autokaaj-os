<!DOCTYPE html>
<html>
<body style="background:#000; color:#0f0; font-family:monospace; padding:10px;">
    <h2>AutoKaaj Pro Dashboard</h2>
    <div id="status" style="border:1px solid #333; padding:10px;">System Ready</div>
    <input type="text" id="cmd" style="width:80%; background:#111; color:#0f0;">
    <button onclick="send()">RUN</button>
    <script>
        async function send() {
            let cmd = document.getElementById('cmd').value;
            document.getElementById('status').innerText = "Task Running...";
            await fetch('/api/execute', {method: 'POST', body: JSON.stringify({cmd: cmd})});
        }
    </script>
</body>
</html>
