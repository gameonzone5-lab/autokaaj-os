<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoKaaj OS</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; padding: 20px; }
        .box { border: 1px solid #333; padding: 10px; margin-bottom: 10px; }
        input, button { width: 100%; padding: 10px; margin: 5px 0; background: #222; color: #fff; border: 1px solid #444; }
    </style>
</head>
<body>
    <h3>AutoKaaj OS - Master Shell</h3>
    <div class="box" id="output">Status: Ready</div>
    <input type="text" id="cmd" placeholder="Enter bash command...">
    <button onclick="run()">EXECUTE</button>
    <script>
        async function run() {
            let cmd = document.getElementById('cmd').value;
            let res = await fetch('http://127.0.0.1:5000/api/generate', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({prompt: "Execute bash: " + cmd})
            });
            let data = await res.json();
            document.getElementById('output').innerText = data.response;
        }
    </script>
</body>
</html>
