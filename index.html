<!DOCTYPE html>
<html>
<body style="background:#000; color:#0f0; font-family:monospace; padding:10px;">
    <h3>AutoKaaj OS - Kernel v1.0</h3>
    <div id="output" style="height:400px; overflow-y:auto; border:1px solid #333; padding:10px;"></div>
    <input type="text" id="cmd" style="width:100%; background:#111; color:#0f0; border:1px solid #444; padding:10px;" placeholder="Linux Command...">
    <button onclick="run()" style="width:100%; padding:10px; background:#0f0; color:#000; font-weight:bold;">EXECUTE KERNEL</button>

    <script>
        async function run() {
            let cmd = document.getElementById('cmd').value;
            let out = document.getElementById('output');
            out.innerHTML += `<br>> ${cmd}<br>`;
            let res = await fetch('http://127.0.0.1:5000/api/generate', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({prompt: cmd})
            });
            let data = await res.json();
            out.innerHTML += data.response.replace(/\n/g, '<br>');
        }
    </script>
</body>
</html>
